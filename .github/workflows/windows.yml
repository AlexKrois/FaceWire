name: Windows build and release

on:
  push:
    branches: [main, master, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Prepare dependencies
        shell: pwsh
        run: ./scripts/prepare.ps1 -IncludeObsRuntime
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/build.ps1 -ObsRoot "$env:GITHUB_WORKSPACE/.deps/obs-runtime"
      - name: Check release tag matches the build
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content dist/build-info.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and CMake project version differ.' }
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/build-info.json
          if-no-files-found: error
      - name: Save test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: test-diagnostics
          path: build/native/Testing/Temporary/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: windows-x64
          path: artifacts
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = Get-ChildItem artifacts -File | Select-Object -ExpandProperty FullName
          gh release create $env:RELEASE_TAG --verify-tag --draft --prerelease --title "Cam Outlines $env:RELEASE_TAG" --generate-notes @files
          if ($LASTEXITCODE) { throw 'Draft release creation failed.' }
